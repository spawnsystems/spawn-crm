<!--
  Template del email de invitación de Spawn CRM.
  Pegar en: Supabase → Authentication → Email Templates → "Invite user".

  Usa {{ .TokenHash }} para que el link caiga en /auth/confirm (flujo SSR).
  {{ .SiteURL }} resuelve al "Site URL" configurado en Supabase
  (Authentication → URL Configuration). En producción debe ser el dominio real,
  no localhost.

  Subject sugerido:  Te invitaron a Spawn CRM
-->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f8fafc;padding:32px 16px;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:32px 28px;">

    <div style="font-size:13px;font-weight:700;letter-spacing:.08em;color:#2563eb;text-transform:uppercase;margin-bottom:20px;">
      Spawn · CRM
    </div>

    <h1 style="font-size:20px;line-height:1.3;margin:0 0 10px;color:#0f172a;">
      Te sumaron al equipo
    </h1>

    <p style="font-size:14px;line-height:1.65;color:#475569;margin:0 0 24px;">
      Te invitaron a Spawn, el CRM de tu concesionaria. Hacé clic en el botón para
      crear tu contraseña y empezar a gestionar tus leads.
    </p>

    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite"
       style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:600;font-size:14px;padding:12px 26px;border-radius:10px;">
      Aceptar invitación y crear contraseña
    </a>

    <p style="font-size:12px;line-height:1.6;color:#94a3b8;margin:28px 0 0;">
      Si no esperabas esta invitación, podés ignorar este correo.
    </p>
  </div>

  <p style="text-align:center;font-size:11px;color:#cbd5e1;letter-spacing:.06em;margin-top:20px;">
    SPAWN · CRM PARA CONCESIONARIOS
  </p>
</div>
